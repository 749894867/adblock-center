name: Daily upstream sync and stable subscription deploy

on:
  push:
    branches: [main]
  schedule:
    # 20:00 UTC = 04:00 Asia/Singapore (the following calendar day)
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # The first run already deploys the bot's commit. Skip the follow-up push event
    # generated by this workflow to avoid a duplicate run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchronize upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_sources.py

      - name: Build stable PopCat subscription
        run: python scripts/build_subscription.py

      - name: Validate Bilibili scripts
        run: |
          node --check site/scripts/bilibili-json.js
          node --check site/scripts/bilibili-proto.js
          node --check site/scripts/bilibili-splash.js
          node - <<'NODE'
          global.$request = { url: "https://app.bilibili.com/x/v2/splash/list?build=1", method: "GET" };
          global.$done = (result) => {
            if (result.status !== 200) throw new Error("splash response is not HTTP 200");
            const body = JSON.parse(result.body);
            if (body.code !== 0 || !Array.isArray(body.data.list) || body.data.list.length !== 0) {
              throw new Error("splash response did not return a successful empty ad list");
            }
            console.log("[BILIBILI] splash request smoke test passed");
          };
          require("./site/scripts/bilibili-splash.js");
          NODE
      - name: Build Apple Intelligence route module
        env:
          APPLE_INTELLIGENCE_POLICY: ${{ vars.APPLE_INTELLIGENCE_POLICY || '默认' }}
        run: python scripts/build_apple_intelligence.py

      - name: Build Quantumult X rule bundle
        run: python scripts/build_ddgks_qx_bundle.py

      - name: Commit synchronized rules and subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/sources site/data/manifest.json site/downloads/AdBlock-Center.sgmodule site/downloads/Apple-Intelligence-Route.sgmodule downloads/Apple-Intelligence-Route.sgmodule downloads/QuantumultX-Moyu-Rules.conf site/downloads/QuantumultX-Moyu-Rules.conf site/qx-install.html scripts/build_ddgks_qx_bundle.py site/rules site/scripts
          if git diff --cached --quiet; then
            echo "No source or subscription changes."
          else
            git commit -m "chore: sync sources and rebuild ad-block subscription"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print subscription URL
        run: |
          echo "Published site: ${{ steps.deployment.outputs.page_url }}"
          echo "Stable PopCat subscription: https://749894867.github.io/adblock-center/downloads/AdBlock-Center.sgmodule"
          echo "Stable Quantumult X rules: https://749894867.github.io/adblock-center/downloads/QuantumultX-Moyu-Rules.conf"
