name: Daily upstream sync and stable subscription deploy

on:
  push:
    branches: [main]
  schedule:
    # 04:00 UTC = 12:00 Asia/Singapore
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # The first run already deploys the bot's commit. Skip the follow-up push event
    # generated by this workflow to avoid a duplicate run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchronize upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_sources.py

      - name: Build stable PopCat subscription
        run: python scripts/build_subscription.py

      - name: Commit synchronized rules and subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/sources site/data/manifest.json site/downloads/AdBlock-Center.sgmodule site/rules
          if git diff --cached --quiet; then
            echo "No source or subscription changes."
          else
            git commit -m "chore: sync sources and rebuild ad-block subscription"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print subscription URL
        run: |
          echo "Published site: ${{ steps.deployment.outputs.page_url }}"
          echo "Stable subscription: https://749894867.github.io/adblock-center/downloads/AdBlock-Center.sgmodule"
